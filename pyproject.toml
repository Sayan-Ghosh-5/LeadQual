[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project metadata ────────────────────────────────────────────────
[project]
name = "my-project"
version = "0.1.0"
description = "A short description of the project."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Your Name", email = "you@example.com" }]

# ── Core dependencies ───────────────────────────────────────────────
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx",
    "pyyaml",
    "groq",
]

# ── Optional / extra dependencies ──────────────────────────────────
[project.optional-dependencies]
# Swap the LLM provider:  pip install .[openai]  or  pip install .[google]
openai = ["openai"]
google = ["google-genai"]

# Development tooling:  pip install -e ".[dev]"
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

# ── Tool configuration ─────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]